<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4F6EF7">
  <title>登录 - 博识堂学生成长档案</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-backdrop"></div>
  <main class="login-card">
    <div class="login-logo">
      <img src="logo.jpg" alt="博识堂" class="login-logo-img">
    </div>
    <h1 class="login-title">博识堂学生成长档案</h1>
    <p class="login-subtitle">学生喜欢 · 家长信任</p>

    <form id="loginForm" class="login-form" autocomplete="off">
      <div class="field">
        <label for="studentId">学生账号（学号）</label>
        <input type="text" id="studentId" name="studentId" placeholder="请输入学号" required maxlength="20">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" required maxlength="20">
      </div>

      <div class="login-options">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe">
          <span class="checkmark"></span>
          <span>记住登录状态</span>
        </label>
      </div>

      <p id="loginError" class="form-error" role="alert"></p>

      <button type="submit" id="loginBtn" class="btn-primary btn-block">登 录</button>
    </form>

    <p class="login-tip">试用账号：学号 001 密码 1234　／　学号 002 密码 5678</p>
    <p class="login-admin-link"><a href="admin.html">机构管理后台 →</a></p>
  </main>

  <footer class="login-footer">
    博识堂教育 · 服务热线：400-000-0000
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
