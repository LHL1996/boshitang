<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4F6EF7">
  <title>学生成长档案</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="js/student.js" defer></script>
</head>
<body class="app-body">

  <!-- 顶部导航 -->
  <header class="app-header">
    <div class="nav-inner">
      <div class="nav-brand">
        <img src="logo.jpg" alt="博识堂" class="nav-logo">
        <span>成长档案</span>
      </div>
      <div class="nav-actions">
        <a href="admin.html" class="btn-logout link-btn">管理后台</a>
        <button id="logoutBtn" class="btn-logout">退出登录</button>
      </div>
    </div>
  </header>

  <main class="app-container" id="app">
    <!-- 加载中 -->
    <div id="loading" class="state-box">
      <div class="spinner"></div>
      <p>正在加载档案…</p>
    </div>

    <!-- ============ 顶部学生信息 ============ -->
    <section id="studentInfo" class="profile-hero hidden">
      <div class="profile-avatar">
        <img id="avatarImg" alt="学生头像">
      </div>
      <div class="profile-meta">
        <h2 id="studentName" class="profile-name">—</h2>
        <p class="profile-tags">
          <span class="tag" id="tagGrade">—</span>
          <span class="tag" id="tagSubject">—</span>
        </p>
        <p class="profile-reg">建档日期：<span id="regDate">—</span></p>
      </div>
    </section>

    <!-- ============ 4 个概览卡片 ============ -->
    <section id="overview" class="overview-grid hidden">
      <div class="ov-card">
        <div class="ov-value" id="ovLatestScore">--</div>
        <div class="ov-label">最近考试总分</div>
        <div class="ov-sub" id="ovLatestRank"></div>
      </div>
      <div class="ov-card">
        <div class="ov-value" id="ovNoonAvg">--</div>
        <div class="ov-label">本周午练平均分</div>
        <div class="ov-sub">满分 100</div>
      </div>
      <div class="ov-card">
        <div class="ov-value" id="ovEveningAvg">--</div>
        <div class="ov-label">本周晚练平均分</div>
        <div class="ov-sub">满分 100</div>
      </div>
      <div class="ov-card ov-card-teacher">
        <div class="ov-label">最新老师评语</div>
        <p class="ov-comment" id="ovComment">—</p>
      </div>
    </section>

    <!-- ============ 成绩趋势图 ============ -->
    <section id="trendSection" class="card hidden">
      <div class="card-head">
        <h3>成绩趋势图</h3>
        <div class="seg-control" id="trendToggle">
          <button class="seg-btn active" data-type="午练">午练</button>
          <button class="seg-btn" data-type="晚练">晚练</button>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="trendChart"></canvas>
      </div>
    </section>

    <!-- ============ 考试成绩记录 ============ -->
    <section id="examSection" class="card hidden">
      <div class="card-head">
        <h3>考试成绩记录</h3>
      </div>
      <div id="examList" class="exam-list"></div>
    </section>

    <!-- ============ 老师评语时间线 ============ -->
    <section id="commentSection" class="card hidden">
      <div class="card-head">
        <h3>老师评语</h3>
      </div>
      <div id="commentList" class="timeline"></div>
    </section>

    <!-- ============ 成长相册 ============ -->
    <section id="gallerySection" class="card hidden">
      <div class="card-head">
        <h3>成长相册</h3>
      </div>
      <div id="galleryGrid" class="gallery-grid"></div>
    </section>

    <!-- 无数据提示 -->
    <div id="emptyBox" class="state-box hidden">该模块暂无数据</div>

    <!-- 底部联系方式 -->
    <footer class="app-footer">
      <p class="org-name">博识堂教育</p>
      <p class="org-contact">电话：400-000-0000　·　地址：XX市XX区XX路XX号</p>
      <p class="org-email">邮箱：service@boshtang.com</p>
    </footer>
  </main>

  <!-- 图片查看弹层 -->
  <div id="lightbox" class="lightbox hidden">
    <button class="lb-close" id="lbClose" aria-label="关闭">&times;</button>
    <div class="lb-body">
      <img id="lbImg" alt="查看图片">
      <p id="lbCaption" class="lb-caption"></p>
    </div>
  </div>

</body>
</html>
